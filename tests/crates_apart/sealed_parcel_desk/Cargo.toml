[package]
name = "sealed_parcel_desk"
version = "0.0.0"
edition = "2024"
publish = false

# `service` holds the service and its placed transports. tixschema's own `serde` turns it on: a
# service needs tixschema's `serde`, and a build without it refuses the declaration.
[features]
service = []

[dependencies]
# No feature of its own: the build that compiles this crate decides tixschema's.
tixschema = { path = "../../..", default-features = false }
# Exactly the crates the docs of the `http_rest` dispatcher and the `amqp_rpc` server name.
futures = ">=0.3.33"
lapin = ">=4.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tokio = { version = ">=1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

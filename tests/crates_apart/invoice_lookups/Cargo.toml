[package]
name = "invoice_lookups"
version = "0.0.0"
edition = "2024"
publish = false

# No `mongodb`: its types list "decode_with" alone. `bson` is what the `decode_with` library and
# each of its types name where tixschema has `bson` on.
[dependencies]
# No feature of its own: the build that compiles this crate decides tixschema's.
tixschema = { path = "../../..", default-features = false }
bson = { version = "2.15", features = ["chrono-0_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

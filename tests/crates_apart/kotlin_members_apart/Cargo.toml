[package]
name = "kotlin_members_apart"
version = "0.0.0"
edition = "2024"
publish = false

# `bounded_brand` holds the brand with a bound. tixschema's own `serde` turns it on: a bound on a
# brand needs tixschema's `serde`, and a build without it refuses the declaration.
[features]
bounded_brand = []

[dependencies]
# No feature of its own: the build that compiles this crate decides tixschema's.
tixschema = { path = "../../..", default-features = false }
serde = { version = "1", features = ["derive"] }
